name: musera
description: Musera - YouTube Music player, simple Flutter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  supabase_flutter: ^2.8.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  go_router: ^14.6.0
  permission_handler: 11.3.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - .env
